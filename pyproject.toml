[project]
name = "psychsim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Alexandre Andorra" }]
requires-python = ">=3.12"
dependencies = [
    "arviz==1.3.0",
    "arviz-base==1.3.0",
    "arviz-plots==1.3.1",
    "arviz-stats==1.3.1",
    "h5netcdf>=1.8.1",
    "matplotlib>=3.11.1",
    "netcdf4>=1.7.4",
    "numpy>=2.4.6",
    "nutpie==0.16.11",
    "pandas>=3.0.5",
    "preliz==0.27.1",
    "pymc==6.3.1",
    "pytensor==3.3.0",
    "scipy>=1.18.1",
    "xarray>=2026.7.0",
]

[project.scripts]
psychsim = "psychsim:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "graphviz>=0.21",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.6",
    "tabulate>=0.10.0",
]

[tool.pytest.ini_options]
markers = ["slow: fits models; run with -m slow"]
testpaths = ["tests"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]  # core + import-sort + pyupgrade; not the pedantic B/SIM rewrites
ignore = ["E501"]  # line length is the formatter's job
